<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ffffff, #dce8ff, #ffffff, #dce8ff);
      background-attachment: fixed;
      color: #000;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      width: 100%;
      padding: 1rem 2rem;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid #476fff;
    }
    header nav {
      position: relative;
    }
    header nav a {
      color: black;
      margin: 0 1rem;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    header nav a:hover {
      border-color: #476fff;
    }
    .logo {
      font-size: 2rem;
      font-weight: bold;
    }
    main {
      display: flex;
      justify-content: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      padding: 2rem;
      max-width: 1400px;
    }
    .video-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-card {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 400px;
      border: 3px solid #476fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 3rem;
    }
    .video-card:hover {
      background-color: rgba(71, 111, 255, 0.1);
    }
    .caption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 1.1rem;
      color: #333;
    }
    .contact-dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: #eee;
      color: black;
      min-width: 200px;
      border: 1px solid #476fff;
      z-index: 20;
      padding: 0.5rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      white-space: nowrap;
    }
    .contact-dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">fy</div>
    <nav>
      <a href="#">g'lyss</a>
      <div class="contact-dropdown">
        <a href="#">Contact</a>
        <div class="dropdown-content">
          <p>Email: yourname@email.com</p>
          <p>Phone: 123-456-7890</p>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="grid">
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 1</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 2</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 3</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 4</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 5</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 6</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 7</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 8</div>
      </div>
      <div class="video-wrapper">
        <div class="video-card">▶</div>
        <div class="caption">Video Title 9</div>
      </div>
    </div>
  </main>
</body>
</html>
